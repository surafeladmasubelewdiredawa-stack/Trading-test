<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bybit Real-Time Trading Terminal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #131722; font-family: sans-serif; color: #d1d4dc; }
        
        .chart-wrapper { position: relative; width: 100%; height: 100vh; display: flex; flex-direction: column; }
        
        /* Header */
        .header { 
            height: 50px; background: #1e222d; border-bottom: 1px solid #363c4e; 
            display: flex; align-items: center; padding: 0 15px; font-size: 13px; font-weight: bold; z-index: 5;
            flex-wrap: nowrap; overflow-x: auto; gap: 10px;
        }
        
        /* Symbol Selector */
        .symbol-select {
            background: #2a2e39; color: #2962ff; border: 1px solid #363c4e; padding: 6px 10px;
            border-radius: 4px; font-weight: bold; font-size: 13px; cursor: pointer; outline: none;
        }
        .symbol-select option { background: #1e222d; color: #d1d4dc; }
        
        .tf-buttons { display: flex; gap: 5px; flex-shrink: 0; }
        .tf-btn {
            background: transparent; color: #787b86; border: 1px solid #363c4e; 
            padding: 4px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .tf-btn:hover { color: #d1d4dc; border-color: #d1d4dc; }
        .tf-btn.active { background: #2962ff; color: white; border-color: #2962ff; }

        .ohlc-info { color: #787b86; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; }
        .replay-badge { display: none; background: #ef5350; color: white; font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: bold; animation: pulse 1.5s infinite; flex-shrink: 0; }
        .live-dot { width: 8px; height: 8px; background: #26a69a; border-radius: 50%; animation: pulse 1.5s infinite; flex-shrink: 0; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Canvas Container */
        .canvas-container { flex: 1; position: relative; overflow: hidden; cursor: crosshair; touch-action: none; }
        #chart_canvas { position: absolute; top: 0; left: 0; }

        #countdown_box { position: absolute; bottom: 0; right: 0; width: 60px; height: 30px; background: #1e222d; border-top: 1px solid #363c4e; border-left: 1px solid #363c4e; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .cd-label { font-size: 8px; color: #787b86; letter-spacing: 0.5px; }
        .cd-time { font-size: 12px; color: #fbc02d; font-weight: bold; font-family: monospace; }

        #replay_mask { display: none; position: absolute; top: 0; right: 60px; width: 30%; height: 100%; background: linear-gradient(to left, rgba(19, 23, 34, 0.95), rgba(19, 23, 34, 0.8)); z-index: 5; pointer-events: none; border-left: 2px solid #ef5350; }

        .replay-toggle-btn { position: absolute; top: 15px; right: 70px; z-index: 50; background: #2962ff; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .replay-toggle-btn:hover { background: #1e53e5; }
        .replay-toggle-btn.active-mode { background: #ef5350; }

        .replay-controls { position: absolute; bottom: 45px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 10px; background: #2a2e39; padding: 10px 20px; border-radius: 8px; border: 1px solid #363c4e; z-index: 50; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .ctrl-btn { background: #363c4e; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .ctrl-btn:hover { background: #2962ff; }
        .ctrl-btn.playing { background: #ef5350; }
        .speed-btn { border-radius: 4px; width: auto; padding: 0 15px; font-size: 13px; font-weight: bold; }
        
        .loading-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #787b86; font-size: 20px; z-index: 100; }
    </style>
</head>
<body>

    <div class="chart-wrapper">
        <div class="header">
            <!-- Symbol Selector -->
            <select id="symbol_select" class="symbol-select" onchange="changeSymbol(this.value)">
                <option value="XAUUSD">XAUUSD (Gold)</option>
                <option value="BTCUSDT">BTCUSDT (Bitcoin)</option>
                <option value="ETHUSDT">ETHUSDT (Ethereum)</option>
                <option value="SOLUSDT">SOLUSDT (Solana)</option>
                <option value="EURUSDT">EURUSDT (Euro)</option>
            </select>
            
            <div class="tf-buttons">
                <button class="tf-btn active" data-tf="1" data-sec="60">1m</button>
                <button class="tf-btn" data-tf="3" data-sec="180">3m</button>
                <button class="tf-btn" data-tf="5" data-sec="300">5m</button>
                <button class="tf-btn" data-tf="15" data-sec="900">15m</button>
                <button class="tf-btn" data-tf="30" data-sec="1800">30m</button>
                <button class="tf-btn" data-tf="60" data-sec="3600">1H</button>
                <button class="tf-btn" data-tf="120" data-sec="7200">2H</button>
                <button class="tf-btn" data-tf="240" data-sec="14400">4H</button>
                <button class="tf-btn" data-tf="D" data-sec="86400">1D</button>
            </div>
            
            <span id="ohlc_data" class="ohlc-info">Loading...</span>
            <div id="replay_badge" class="replay-badge">REPLAY</div>
            <div id="live_dot" class="live-dot"></div>
        </div>
        
        <div class="canvas-container" id="canvas_container">
            <div id="loading_text" class="loading-text">Connecting to Bybit...</div>
            <canvas id="chart_canvas"></canvas>
            <div id="replay_mask"></div>
            
            <div id="countdown_box">
                <span class="cd-label">TIME</span>
                <span id="cd_text" class="cd-time">00:00</span>
            </div>

            <button id="replay_toggle_btn" class="replay-toggle-btn" onclick="toggleReplayMode()">▶ Replay</button>

            <div id="replay_controls" class="replay-controls">
                <button class="ctrl-btn" onclick="replayBack()">⏮</button>
                <button id="play_btn" class="ctrl-btn" onclick="replayPlayPause()">▶</button>
                <button class="ctrl-btn" onclick="replayNext()">⏭</button>
                <button id="speed_btn" class="ctrl-btn speed-btn" onclick="changeReplaySpeed()">1x</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('chart_canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas_container');
        const ohlcDisplay = document.getElementById('ohlc_data');
        const cdTextDisplay = document.getElementById('cd_text');
        const countdownBox = document.getElementById('countdown_box');
        const replayBadge = document.getElementById('replay_badge');
        const liveDot = document.getElementById('live_dot');
        const replayMask = document.getElementById('replay_mask');
        const replayControls = document.getElementById('replay_controls');
        const playBtn = document.getElementById('play_btn');
        const speedBtn = document.getElementById('speed_btn');
        const replayToggleBtn = document.getElementById('replay_toggle_btn');
        const loadingText = document.getElementById('loading_text');
        
        let candleData = [];
        let visibleCandles = 60; 
        let scrollOffsetPixels = 0;
        let isDragging = false;
        let dragStartX = 0;
        let dragStartOffsetPixels = 0;
        let mouseX = -1, mouseY = -1;
        let initialPinchDistance = 0;
        let initialVisibleCandles = 0;

        // API & State
        let currentSymbol = "XAUUSD";
        let currentBybitInterval = "1"; 
        let currentTimeframeSec = 60; 
        let countdownIntervalId = null;
        let ws = null; 

        // Replay State
        let isReplayMode = false;
        let replayIndex = 0;
        let isReplayPlaying = false;
        let replayPlayInterval = null;
        let replaySpeed = 1;

        // ==========================================
        // BYBIT API INTEGRATION (GITHUB PAGES READY)
        // ==========================================
        async function fetchHistoricalData() {
            loadingText.style.display = 'block';
            try {
                const url = `https://api.bybit.com/v5/market/kline?category=linear&symbol=${currentSymbol}&interval=${currentBybitInterval}&limit=200`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.retCode === 0 && data.result.list.length > 0) {
                    const candles = data.result.list.reverse(); 
                    candleData = candles.map(d => ({
                        time: parseInt(d[0]),
                        open: parseFloat(d[1]),
                        high: parseFloat(d[2]),
                        low: parseFloat(d[3]),
                        close: parseFloat(d[4])
                    }));
                    loadingText.style.display = 'none';
                    scrollOffsetPixels = (candleData.length - visibleCandles) * ((canvas.width - 60) / visibleCandles);
                    drawChart();
                } else {
                    throw new Error("No data");
                }
            } catch (error) {
                console.error("Bybit Fetch Error:", error);
                loadingText.innerText = "API Connection Error";
            }
        }

        function connectWebSocket() {
            if (ws) ws.close();
            
            // Changed to WSS (Secure WebSocket) for GitHub Pages compatibility
            ws = new WebSocket('wss://stream.bybit.com/v5/public/linear');
            
            ws.onopen = () => {
                console.log("WS Connected");
                ws.send(JSON.stringify({ "op": "subscribe", "args": [`kline.${currentBybitInterval}.${currentSymbol}`] }));
            };
            
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.topic && msg.topic.startsWith('kline.')) {
                    const kline = msg.data;
                    let newCandle = {
                        time: kline.start,
                        open: parseFloat(kline.open),
                        high: parseFloat(kline.high),
                        low: parseFloat(kline.low),
                        close: parseFloat(kline.close)
                    };

                    let lastCandle = candleData[candleData.length - 1];
                    if (lastCandle && lastCandle.time === newCandle.time) {
                        lastCandle.close = newCandle.close;
                        lastCandle.high = Math.max(lastCandle.high, newCandle.high);
                        lastCandle.low = Math.min(lastCandle.low, newCandle.low);
                    } else if (lastCandle && newCandle.time > lastCandle.time) {
                        candleData.push(newCandle);
                    }
                    drawChart();
                }
            };

            ws.onerror = (e) => console.error("WS Error", e);
        }

        function changeSymbol(symbol) {
            currentSymbol = symbol;
            if (isReplayMode) toggleReplayMode(); 
            fetchHistoricalData();
            connectWebSocket();
        }

        function changeTimeframe(bybitTf, sec) {
            currentBybitInterval = bybitTf;
            currentTimeframeSec = sec;
            if (isReplayMode) toggleReplayMode(); 
            document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            fetchHistoricalData();
            connectWebSocket();
        }

        document.querySelectorAll('.tf-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                changeTimeframe(e.target.getAttribute('data-tf'), parseInt(e.target.getAttribute('data-sec')));
            });
        });

        // Countdown
        function updateCountdown() {
            if (candleData.length === 0 || isReplayMode) return;
            let lastCandle = candleData[candleData.length - 1];
            let timeLeftMs = (lastCandle.time + (currentTimeframeSec * 1000)) - Date.now();
            if (timeLeftMs <= 0) { timeLeftMs = currentTimeframeSec * 1000; }
            let t = Math.max(0, Math.floor(timeLeftMs / 1000));
            let h = Math.floor(t / 3600); let m = Math.floor((t % 3600) / 60); let s = t % 60;
            cdTextDisplay.innerText = (h > 0 ? h.toString().padStart(2, '0') + ":" : "") + m.toString().padStart(2, '0') + ":" + s.toString().padStart(2, '0');
        }

        // ==========================================
        // REPLAY LOGIC
        // ==========================================
        function toggleReplayMode() {
            isReplayMode = !isReplayMode;
            if (isReplayMode) {
                replayBadge.style.display = 'block'; liveDot.style.display = 'none'; replayMask.style.display = 'block';
                replayControls.style.display = 'flex'; countdownBox.style.display = 'none';
                replayToggleBtn.innerText = '⏹ Exit Replay'; replayToggleBtn.classList.add('active-mode');
                isReplayPlaying = false; playBtn.innerText = '▶'; playBtn.classList.remove('playing'); clearInterval(replayPlayInterval);
                replayIndex = Math.max(0, candleData.length - 80); 
                if (ws) ws.close(); 
                drawChart();
            } else {
                replayBadge.style.display = 'none'; liveDot.style.display = 'block'; replayMask.style.display = 'none';
                replayControls.style.display = 'none'; countdownBox.style.display = 'flex';
                replayToggleBtn.innerText = '▶ Replay'; replayToggleBtn.classList.remove('active-mode');
                isReplayPlaying = false; clearInterval(replayPlayInterval);
                scrollOffsetPixels = (candleData.length - visibleCandles) * ((canvas.width - 60) / visibleCandles);
                connectWebSocket(); 
                drawChart();
            }
        }
        function replayNext() { if (!isReplayMode) return; if (replayIndex < candleData.length - 1) { replayIndex++; drawChart(); } }
        function replayBack() { if (!isReplayMode) return; if (replayIndex > 0) { replayIndex--; drawChart(); } }
        function replayPlayPause() {
            isReplayPlaying = !isReplayPlaying;
            if (isReplayPlaying) {
                playBtn.innerText = '⏸'; playBtn.classList.add('playing');
                replayPlayInterval = setInterval(() => { if (replayIndex < candleData.length - 1) { replayIndex++; drawChart(); } else { replayPlayPause(); } }, 1000 / replaySpeed);
            } else { playBtn.innerText = '▶'; playBtn.classList.remove('playing'); clearInterval(replayPlayInterval); }
        }
        function changeReplaySpeed() {
            if (replaySpeed === 1) replaySpeed = 2; else if (replaySpeed === 2) replaySpeed = 5; else replaySpeed = 1;
            speedBtn.innerText = replaySpeed + 'x';
            if (isReplayPlaying) { clearInterval(replayPlayInterval); replayPlayPause(); replayPlayPause(); }
        }

        // ==========================================
        // CANVAS DRAWING
        // ==========================================
        function resizeCanvas() { canvas.width = container.clientWidth; canvas.height = container.clientHeight; drawChart(); }

        function drawChart() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (candleData.length === 0) return;

            const PRICE_WIDTH = 60; const TIME_HEIGHT = 30;
            const totalCandleSpace = Math.max(3, (canvas.width - PRICE_WIDTH) / visibleCandles);
            const CANDLE_WIDTH = totalCandleSpace * 0.8;
            const chartWidth = canvas.width - PRICE_WIDTH; const chartHeight = canvas.height - TIME_HEIGHT;

            let dataToRender = isReplayMode ? candleData.slice(0, replayIndex + 1) : candleData;
            if (isReplayMode) { let startIdx = Math.max(0, dataToRender.length - visibleCandles); scrollOffsetPixels = startIdx * totalCandleSpace; }

            let startIdx = Math.floor(scrollOffsetPixels / totalCandleSpace);
            let subPixelOffset = -(scrollOffsetPixels % totalCandleSpace);
            if (startIdx < 0) startIdx = 0;
            let endIdx = startIdx + visibleCandles + 2;
            if (endIdx > dataToRender.length) endIdx = dataToRender.length;
            const visibleData = dataToRender.slice(startIdx, endIdx);

            let minPrice = Infinity, maxPrice = -Infinity;
            visibleData.forEach(c => { minPrice = Math.min(minPrice, c.low); maxPrice = Math.max(maxPrice, c.high); });
            const pricePadding = (maxPrice - minPrice) * 0.1 || 1; minPrice -= pricePadding; maxPrice += pricePadding;
            const priceToY = (price) => chartHeight - ((price - minPrice) / (maxPrice - minPrice)) * chartHeight;

            ctx.strokeStyle = '#1e222d'; ctx.lineWidth = 1;
            for (let i = 0; i <= 5; i++) { let y = (chartHeight / 5) * i; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(chartWidth, y); ctx.stroke(); }

            visibleData.forEach((candle, i) => {
                const x = (i * totalCandleSpace) + subPixelOffset;
                if (x + totalCandleSpace < 0 || x > chartWidth) return;
                const isGreen = candle.close >= candle.open;
                ctx.fillStyle = isGreen ? '#26a69a' : '#ef5350'; ctx.strokeStyle = isGreen ? '#26a69a' : '#ef5350';
                const wickX = x + (CANDLE_WIDTH / 2);
                ctx.beginPath(); ctx.moveTo(wickX, priceToY(candle.high)); ctx.lineTo(wickX, priceToY(candle.low)); ctx.stroke();
                const openY = priceToY(candle.open); const closeY = priceToY(candle.close);
                ctx.fillRect(x, Math.min(openY, closeY), CANDLE_WIDTH, Math.max(Math.abs(openY - closeY), 1));
                candle._x = x; 
            });

            let lastCandle = dataToRender[dataToRender.length - 1];
            let livePrice = lastCandle.close; let liveY = priceToY(livePrice);
            let liveColor = lastCandle.close >= lastCandle.open ? '#26a69a' : '#ef5350';
            ctx.strokeStyle = liveColor; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
            ctx.beginPath(); ctx.moveTo(0, liveY); ctx.lineTo(chartWidth, liveY); ctx.stroke(); ctx.setLineDash([]);

            ctx.fillStyle = '#1e222d'; ctx.fillRect(chartWidth, 0, PRICE_WIDTH, canvas.height);
            ctx.fillStyle = '#787b86'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
            for (let i = 0; i <= 5; i++) { let price = minPrice + ((maxPrice - minPrice) / 5) * i; ctx.fillText(price.toFixed(2), canvas.width - 10, priceToY(price) + 4); }

            ctx.fillStyle = liveColor; ctx.fillRect(chartWidth, liveY - 10, PRICE_WIDTH, 20);
            ctx.fillStyle = 'white'; ctx.fillText(livePrice.toFixed(2), canvas.width - 10, liveY + 4);

            ctx.fillStyle = '#131722'; ctx.fillRect(0, chartHeight, canvas.width, TIME_HEIGHT);
            ctx.fillStyle = '#787b86'; ctx.textAlign = 'center';
            for (let i = 0; i < visibleData.length; i += Math.max(1, Math.floor(visibleCandles / 8))) {
                if (visibleData[i] && visibleData[i]._x > 0) {
                    let date = new Date(visibleData[i].time); let timeStr = "";
                    if (currentTimeframeSec >= 86400) timeStr = `${date.getMonth()+1}/${date.getDate()}`;
                    else { timeStr = `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`; }
                    ctx.fillText(timeStr, visibleData[i]._x + (CANDLE_WIDTH/2), chartHeight + 18);
                }
            }
            
            if (mouseX > 0 && mouseX < chartWidth && mouseY > 0 && mouseY < chartHeight && !isDragging) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
                ctx.beginPath(); ctx.moveTo(0, mouseY); ctx.lineTo(chartWidth, mouseY); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(mouseX, 0); ctx.lineTo(mouseX, chartHeight); ctx.stroke(); ctx.setLineDash([]);
                let candleIdx = Math.floor((mouseX - subPixelOffset) / totalCandleSpace);
                if(candleIdx >= 0 && candleIdx < visibleData.length) {
                    let c = visibleData[candleIdx]; ohlcDisplay.innerText = `O: ${c.open.toFixed(2)}  H: ${c.high.toFixed(2)}  L: ${c.low.toFixed(2)}  C: ${c.close.toFixed(2)}`;
                }
            } else if (!isDragging) { let c = lastCandle; ohlcDisplay.innerText = `O: ${c.open.toFixed(2)}  H: ${c.high.toFixed(2)}  L: ${c.low.toFixed(2)}  C: ${c.close.toFixed(2)}`; }
        }

        // Event Listeners
        function getTouchDistance(e) { if (e.touches.length < 2) return 0; let dx = e.touches[0].clientX - e.touches[1].clientX; let dy = e.touches[0].clientY - e.touches[1].clientY; return Math.sqrt(dx * dx + dy * dy); }
        canvas.addEventListener('mousemove', (e) => { let rect = canvas.getBoundingClientRect(); mouseX = e.clientX - rect.left; mouseY = e.clientY - rect.top; if (isDragging) { scrollOffsetPixels = dragStartOffsetPixels - (e.clientX - dragStartX); let maxScroll = ((isReplayMode ? replayIndex+1 : candleData.length) - visibleCandles) * ((canvas.width - 60) / visibleCandles); if (scrollOffsetPixels > maxScroll) scrollOffsetPixels = maxScroll; if (scrollOffsetPixels < 0) scrollOffsetPixels = 0; } drawChart(); });
        canvas.addEventListener('mouseleave', () => { mouseX = -1; mouseY = -1; drawChart(); });
        canvas.addEventListener('mousedown', (e) => { isDragging = true; dragStartX = e.clientX; dragStartOffsetPixels = scrollOffsetPixels; });
        window.addEventListener('mouseup', () => { isDragging = false; });
        canvas.addEventListener('wheel', (e) => { e.preventDefault(); if (e.deltaY > 0) visibleCandles += 5; else visibleCandles -= 5; if (visibleCandles < 10) visibleCandles = 10; if (visibleCandles > 300) visibleCandles = 300; drawChart(); });
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); if (e.touches.length === 1) { isDragging = true; dragStartX = e.touches[0].clientX; dragStartOffsetPixels = scrollOffsetPixels; mouseX = -1; mouseY = -1; } else if (e.touches.length === 2) { isDragging = false; initialPinchDistance = getTouchDistance(e); initialVisibleCandles = visibleCandles; } }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if (e.touches.length === 1 && isDragging) { scrollOffsetPixels = dragStartOffsetPixels - (e.touches[0].clientX - dragStartX); let maxScroll = ((isReplayMode ? replayIndex+1 : candleData.length) - visibleCandles) * ((canvas.width - 60) / visibleCandles); if (scrollOffsetPixels > maxScroll) scrollOffsetPixels = maxScroll; if (scrollOffsetPixels < 0) scrollOffsetPixels = 0; drawChart(); } else if (e.touches.length === 2) { let currentDistance = getTouchDistance(e); if (initialPinchDistance > 0) { visibleCandles = Math.round(initialVisibleCandles * (initialPinchDistance / currentDistance)); if (visibleCandles < 10) visibleCandles = 10; if (visibleCandles > 300) visibleCandles = 300; drawChart(); } } }, { passive: false });
        canvas.addEventListener('touchend', () => { isDragging = false; initialPinchDistance = 0; mouseX = -1; mouseY = -1; drawChart(); });

        // Initialization
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        fetchHistoricalData();
        connectWebSocket();
        countdownIntervalId = setInterval(updateCountdown, 1000);

    </script>
</body>
</html>
